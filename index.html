<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Smug.ie — coming soon. Taskforce, 2026.">
  <title>Smug.ie — Coming soon</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #000; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #000; color: #b9bbc5; font-family: 'Courier New', monospace; }
    main { width: min(100%, 760px); padding: 20px 16px 28px; text-align: center; }
    .screen { position: relative; overflow: hidden; }
    img { display: block; width: 100%; height: auto; max-height: calc(100svh - 100px); object-fit: contain; image-rendering: pixelated; }
    .screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.12) 3px 4px); animation: shimmer 5s ease-in-out 1; }
    footer { margin-top: 22px; font-size: 12px; line-height: 1.5; letter-spacing: .2em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @keyframes shimmer { 0%,100% { opacity: .4; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .screen::after { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Smug.ie — Coming soon</h1>
    <div class="screen"><img src="coming-soon.png" alt="Retro pixel-art Smug.ie coming soon title screen, with neon stars and a sunset over a cyan grid." width="1254" height="1254" fetchpriority="high"></div>
    <footer>TASKFORCE, 2026</footer>
  </main>
</body>
</html>
